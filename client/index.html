<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Inter, with a system stack behind it in tokens.css so a failed
         request degrades rather than breaking the type. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Buy Center — Layton Gaming</title>
    <meta name="description" content="Counter tool for buying trading cards from customers." />

    <!-- Generated by `npm run assets` from assets/source/. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />

    <!-- Tells the browser both themes are supported, so form controls and
         scrollbars are painted to match rather than defaulting to light. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#204199" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
